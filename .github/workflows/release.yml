# 0.71.1: every published release gets hc_thermostat.zip (the integration's files at the zip's root), which HACS
# downloads (hacs.json zip_release) – so the release page counts the downloads.
name: Release zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build the zip for"
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Build hc_thermostat.zip
        run: |
          cd custom_components/hc_thermostat
          find . -name "__pycache__" -prune -o -type f -print | sort | zip -q -X "$GITHUB_WORKSPACE/hc_thermostat.zip" -@
          unzip -l "$GITHUB_WORKSPACE/hc_thermostat.zip" | tail -1
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" hc_thermostat.zip --clobber --repo "${{ github.repository }}"
