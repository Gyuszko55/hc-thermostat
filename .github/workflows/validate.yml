# 0.47.0: checks on every push and pull request – Home Assistant's manifest / translation check (hassfest), the HACS
# repository check and the test suite with Home Assistant installed (the tests that need it run here too).
name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361  # master, 2026-10-26 (0.48.1: pinned)

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa  # main (0.48.1: pinned)
        with:
          category: integration
          ignore: brands

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant and pytest
        run: pip install "homeassistant==2026.10.0" pytest
      - name: Tests
        run: python -m pytest -q tests
