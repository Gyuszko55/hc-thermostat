# hcd as a local Home Assistant add-on (F2: shadow mode – it decides and compares, it switches nothing)
name: HC daemon (hcd)
version: "0.1.4"
slug: hcd
description: HC Thermostat without Home Assistant's core – shadow comparison with the HC integration
url: https://github.com/Gyuszko55/hc-thermostat
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true  # reads states over REST (the Supervisor offers no read-only scope)
services:
  - mqtt:need
ingress: true
ingress_port: 8099
panel_icon: mdi:thermostat-auto
panel_title: hcd
map:
  - type: share
    read_only: true  # 0.1.3: hcd only reads its settings there; its own state is in /data
options:
  config_file: /share/hcd/hcd.yaml
  log_level: info
  web_allow: []
schema:
  config_file: str
  log_level: list(debug|info|warning|error)
  web_allow:  # 0.1.3: besides the ingress proxy – addresses or add-on host names that may read the page / API
    - str
